[package]
name = "skate2-pc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
skate2-core = { path = "../../crates/skate2-core" }
skate2-formats = { path = "../../crates/skate2-formats" }
skate2-audio = { path = "../../crates/skate2-audio" }
skate2-net = { path = "../../crates/skate2-net" }
skate2-update = { path = "../../crates/skate2-update" }
cpal = "=0.18.2"
wgpu = "=30.0.1"
winit = "=0.29.15"
pollster = "=0.3.0"
jpeg-encoder = "=0.7.1"
jpeg-decoder = { version = "=0.3.2", default-features = false }
rayon = "=1.12.0"
mimalloc = { version = "=0.1.52", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
sdl3 = { version = "=0.20.0", features = ["build-from-source-static"] }
rfd = { version = "=0.17.2", default-features = false }
log = "=0.4.34"

[build-dependencies]
ed25519-dalek = "=2.2.0"
getrandom = "=0.3.4"
sha2 = "=0.10.9"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
xinput = { package = "thindx-xinput", version = "=0.0.0-2024-02-04" }
rustix = { version = "=1.1.4", features = ["net"] }

# Linux's file dialogs go through the desktop portal; its message dialogs through zenity. SDL
# reads only the pads, so it builds without X11's and Wayland's development files.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
sdl3 = { version = "=0.20.0", features = ["build-from-source-static", "build-from-source-unix-console"] }
